<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvTrack — Inventory & Order Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2333;
      --border: #30363d;
      --border2: #21262d;
      --text: #e6edf3;
      --muted: #8b949e;
      --dim: #484f58;
      --blue: #58a6ff;
      --blue-bg: rgba(88,166,255,0.1);
      --green: #3fb950;
      --green-bg: rgba(63,185,80,0.1);
      --red: #f85149;
      --red-bg: rgba(248,81,73,0.1);
      --yellow: #d29922;
      --yellow-bg: rgba(210,153,34,0.1);
      --radius: 8px;
      --radius-sm: 6px;
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

    /* ── Layout ── */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; min-width: 240px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .logo { padding: 20px 16px 16px; border-bottom: 1px solid var(--border2); }
    .logo-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--blue); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .logo-name { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }

    .nav { padding: 8px 8px; flex: 1; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px;
      background: none; border: none; border-radius: var(--radius-sm); color: var(--muted);
      font-size: 13.5px; font-family: 'Inter', sans-serif; font-weight: 500;
      cursor: pointer; transition: all 0.12s; text-align: left;
    }
    .nav-btn:hover { background: var(--surface2); color: var(--text); }
    .nav-btn.active { background: var(--blue-bg); color: var(--blue); }
    .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

    .sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--border2); font-size: 11px; color: var(--dim); font-family: 'JetBrains Mono', monospace; }

    .content { flex: 1; padding: 32px 36px; max-width: 1100px; overflow-x: hidden; }

    /* ── Page header ── */
    .ph { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 16px; }
    .ph-title { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; }
    .ph-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 500; }
    .c-blue { color: var(--blue); } .c-green { color: var(--green); } .c-yellow { color: var(--yellow); } .c-red { color: var(--red); }

    /* ── Card ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .card-hd { padding: 16px 20px; border-bottom: 1px solid var(--border2); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-size: 14px; font-weight: 600; }
    .card-body { padding: 0; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); text-align: left; border-bottom: 1px solid var(--border2); }
    td { padding: 12px 16px; font-size: 13.5px; border-bottom: 1px solid var(--border2); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; border: none; transition: all 0.12s; }
    .btn-primary { background: var(--blue); color: #0d1117; }
    .btn-primary:hover { background: #79b8ff; }
    .btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--border); background: var(--surface); }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,81,73,0.2); }
    .btn-danger:hover { background: var(--red); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Badge ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
    .badge-red { background: var(--red-bg); color: var(--red); }
    .badge-blue { background: var(--blue-bg); color: var(--blue); }

    /* ── Mono ── */
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    /* ── Modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* ── Form ── */
    .fg { margin-bottom: 14px; }
    .fl { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 6px; }
    .fi, .fs {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 9px 12px; color: var(--text); font-size: 13.5px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.12s;
    }
    .fi:focus, .fs:focus { border-color: var(--blue); }
    .fi::placeholder { color: var(--dim); }

    /* ── Alerts ── */
    .alert { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }
    .alert-err { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,81,73,0.2); }
    .alert-ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(63,185,80,0.2); }

    /* ── Order item rows ── */
    .item-row { display: grid; grid-template-columns: 1fr 90px 36px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border2); }
    .item-row:last-child { border-bottom: none; }
    .rm-btn { background: var(--red-bg); color: var(--red); border: none; border-radius: 4px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .rm-btn:hover { background: var(--red); color: #fff; }
    .add-row-btn { width: 100%; padding: 8px; background: none; border: 1px dashed var(--border); border-radius: var(--radius-sm); color: var(--muted); font-size: 12px; cursor: pointer; font-family: 'Inter', sans-serif; margin-top: 8px; transition: all 0.12s; }
    .add-row-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* ── Empty ── */
    .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
    .empty-icon { font-size: 32px; opacity: 0.4; margin-bottom: 10px; }

    /* ── Order detail ── */
    .order-detail { padding: 16px 20px; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border2); font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--muted); }

    /* ── Loading ── */
    .loading { padding: 60px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── Responsive ── */
    @media(max-width: 768px) {
      .stats { grid-template-columns: repeat(2,1fr); }
      .sidebar { display: none; }
      .content { padding: 20px 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── API ──────────────────────────────────────────────────────────────────────
const API = https://inventory-order-management-system-1guo.onrender.com
const http = axios.create({ baseURL: API });

const api = {
  // products
  getProducts:  ()      => http.get("/products"),
  createProduct:(d)     => http.post("/products", d),
  updateProduct:(id, d) => http.put(`/products/${id}`, d),
  deleteProduct:(id)    => http.delete(`/products/${id}`),
  // customers
  getCustomers:  ()     => http.get("/customers"),
  createCustomer:(d)    => http.post("/customers", d),
  deleteCustomer:(id)   => http.delete(`/customers/${id}`),
  // orders
  getOrders:  ()        => http.get("/orders"),
  getOrder:   (id)      => http.get(`/orders/${id}`),
  createOrder:(d)       => http.post("/orders", d),
  deleteOrder:(id)      => http.delete(`/orders/${id}`),
  // dashboard
  getDashboard: ()      => http.get("/dashboard"),
};

const fmt = (n) => `$${Number(n).toFixed(2)}`;
const errMsg = (e) => e?.response?.data?.detail || e?.message || "Something went wrong";

// ── Small shared components ──────────────────────────────────────────────────
function Alert({ msg, type = "err", onClose }) {
  if (!msg) return null;
  return (
    <div className={`alert alert-${type}`} style={{ cursor: "pointer" }} onClick={onClose}>
      {type === "err" ? "✖ " : "✔ "}{msg}
    </div>
  );
}

function ConfirmModal({ message, onConfirm, onCancel }) {
  return (
    <div className="overlay" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 360 }}>
        <div className="modal-title">Confirm Action</div>
        <p style={{ color: "var(--muted)", fontSize: 13, marginBottom: 4 }}>{message}</p>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
          <button className="btn btn-danger" onClick={onConfirm}>Confirm Delete</button>
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard() {
  const [stats, setStats] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => {
    api.getDashboard()
      .then(r => setStats(r.data))
      .catch(e => setErr(errMsg(e)));
  }, []);

  if (err) return <div className="alert alert-err">{err}</div>;
  if (!stats) return <div className="loading">Loading dashboard…</div>;

  return (
    <div>
      <div className="ph">
        <div>
          <div className="ph-title">Dashboard</div>
          <div className="ph-sub">System overview at a glance</div>
        </div>
      </div>

      <div className="stats">
        <div className="stat">
          <div className="stat-label">Products</div>
          <div className="stat-val c-blue">{stats.total_products}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Customers</div>
          <div className="stat-val c-green">{stats.total_customers}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Orders</div>
          <div className="stat-val">{stats.total_orders}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Low Stock</div>
          <div className={`stat-val ${stats.low_stock_products.length > 0 ? "c-yellow" : "c-green"}`}>
            {stats.low_stock_products.length}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-hd">
          <div className="card-title">⚠ Low Stock Products <span style={{ color: "var(--muted)", fontWeight: 400, fontSize: 12 }}>(≤ 10 units)</span></div>
        </div>
        <div className="card-body">
          {stats.low_stock_products.length === 0 ? (
            <div className="empty"><div className="empty-icon">✓</div><p>All products are well-stocked</p></div>
          ) : (
            <table>
              <thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead>
              <tbody>
                {stats.low_stock_products.map(p => (
                  <tr key={p.id}>
                    <td>{p.name}</td>
                    <td><span className="mono">{p.sku}</span></td>
                    <td className="mono">{fmt(p.price)}</td>
                    <td><span className={`badge ${p.quantity === 0 ? "badge-red" : "badge-yellow"}`}>{p.quantity} units</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// ── PRODUCTS ─────────────────────────────────────────────────────────────────
function ProductModal({ product, onClose, onSaved }) {
  const blank = { name: "", sku: "", price: "", quantity: "" };
  const [form, setForm] = useState(product ? { ...product, price: String(product.price), quantity: String(product.quantity) } : blank);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = async () => {
    if (!form.name.trim() || !form.sku.trim() || form.price === "" || form.quantity === "") {
      return setErr("All fields are required.");
    }
    const price = parseFloat(form.price), qty = parseInt(form.quantity);
    if (isNaN(price) || price < 0) return setErr("Price must be a non-negative number.");
    if (isNaN(qty) || qty < 0) return setErr("Quantity must be a non-negative integer.");
    setLoading(true); setErr("");
    try {
      const payload = { name: form.name.trim(), sku: form.sku.trim(), price, quantity: qty };
      if (product) await api.updateProduct(product.id, payload);
      else await api.createProduct(payload);
      onSaved();
    } catch(e) { setErr(errMsg(e)); }
    finally { setLoading(false); }
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">{product ? "Edit Product" : "Add New Product"}</div>
        <Alert msg={err} type="err" onClose={() => setErr("")} />
        <div className="fg"><label className="fl">Product Name</label><input className="fi" value={form.name} onChange={e=>set("name",e.target.value)} placeholder="e.g. Wireless Keyboard" /></div>
        <div className="fg"><label className="fl">SKU / Code</label><input className="fi" value={form.sku} onChange={e=>set("sku",e.target.value)} placeholder="e.g. WK-001" /></div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <div className="fg"><label className="fl">Price ($)</label><input className="fi" type="number" min="0" step="0.01" value={form.price} onChange={e=>set("price",e.target.value)} placeholder="0.00" /></div>
          <div className="fg"><label className="fl">Quantity</label><input className="fi" type="number" min="0" value={form.quantity} onChange={e=>set("quantity",e.target.value)} placeholder="0" /></div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>{loading ? "Saving…" : product ? "Save Changes" : "Add Product"}</button>
        </div>
      </div>
    </div>
  );
}

function Products() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null); // null | "add" | product obj
  const [confirm, setConfirm] = useState(null);
  const [flash, setFlash] = useState({ msg: "", type: "ok" });

  const load = useCallback(() => {
    setLoading(true);
    api.getProducts().then(r => setProducts(r.data)).catch(() => {}).finally(() => setLoading(false));
  }, []);

  useEffect(() => { load(); }, [load]);

  const showFlash = (msg, type = "ok") => { setFlash({ msg, type }); setTimeout(() => setFlash({ msg: "", type: "ok" }), 3000); };

  const handleDelete = (p) => setConfirm({
    message: `Delete "${p.name}"? This cannot be undone.`,
    onConfirm: async () => {
      try { await api.deleteProduct(p.id); showFlash("Product deleted."); load(); }
      catch(e) { showFlash(errMsg(e), "err"); }
      setConfirm(null);
    }
  });

  const stockBadge = (q) => q === 0 ? <span className="badge badge-red">Out of stock</span>
    : q <= 10 ? <span className="badge badge-yellow">{q}</span>
    : <span className="badge badge-green">{q}</span>;

  return (
    <div>
      <div className="ph">
        <div>
          <div className="ph-title">Products</div>
          <div className="ph-sub">{products.length} item{products.length !== 1 ? "s" : ""} in inventory</div>
        </div>
        <button className="btn btn-primary" onClick={() => setModal("add")}>+ Add Product</button>
      </div>
      <Alert msg={flash.msg} type={flash.type} onClose={() => setFlash({ msg: "" })} />
      <div className="card">
        <div className="card-body">
          {loading ? <div className="loading">Loading…</div> : products.length === 0 ? (
            <div className="empty"><div className="empty-icon">📦</div><p>No products yet. Add your first product.</p></div>
          ) : (
            <table>
              <thead><tr><th>#</th><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
              <tbody>
                {products.map(p => (
                  <tr key={p.id}>
                    <td className="mono" style={{ color: "var(--dim)" }}>{p.id}</td>
                    <td style={{ fontWeight: 500 }}>{p.name}</td>
                    <td><span className="mono">{p.sku}</span></td>
                    <td className="mono">{fmt(p.price)}</td>
                    <td>{stockBadge(p.quantity)}</td>
                    <td>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button className="btn btn-ghost btn-sm" onClick={() => setModal(p)}>Edit</button>
                        <button className="btn btn-danger btn-sm" onClick={() => handleDelete(p)}>Delete</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
      {modal && (
        <ProductModal
          product={modal === "add" ? null : modal}
          onClose={() => setModal(null)}
          onSaved={() => { setModal(null); showFlash("Product saved."); load(); }}
        />
      )}
      {confirm && <ConfirmModal {...confirm} onCancel={() => setConfirm(null)} />}
    </div>
  );
}

// ── CUSTOMERS ────────────────────────────────────────────────────────────────
function CustomerModal({ onClose, onSaved }) {
  const [form, setForm] = useState({ full_name: "", email: "", phone: "" });
  const [err, setErr] = useState(""); const [loading, setLoading] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = async () => {
    if (!form.full_name.trim() || !form.email.trim() || !form.phone.trim()) return setErr("All fields are required.");
    if (!/\S+@\S+\.\S+/.test(form.email)) return setErr("Enter a valid email address.");
    setLoading(true); setErr("");
    try { await api.createCustomer({ full_name: form.full_name.trim(), email: form.email.trim(), phone: form.phone.trim() }); onSaved(); }
    catch(e) { setErr(errMsg(e)); }
    finally { setLoading(false); }
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">Add New Customer</div>
        <Alert msg={err} type="err" onClose={() => setErr("")} />
        <div className="fg"><label className="fl">Full Name</label><input className="fi" value={form.full_name} onChange={e=>set("full_name",e.target.value)} placeholder="e.g. Jane Smith" /></div>
        <div className="fg"><label className="fl">Email Address</label><input className="fi" type="email" value={form.email} onChange={e=>set("email",e.target.value)} placeholder="jane@example.com" /></div>
        <div className="fg"><label className="fl">Phone Number</label><input className="fi" value={form.phone} onChange={e=>set("phone",e.target.value)} placeholder="+91 98765 43210" /></div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>{loading ? "Saving…" : "Add Customer"}</button>
        </div>
      </div>
    </div>
  );
}

function Customers() {
  const [customers, setCustomers] = useState([]); const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false); const [confirm, setConfirm] = useState(null);
  const [flash, setFlash] = useState({ msg: "", type: "ok" });
  const showFlash = (msg, type="ok") => { setFlash({ msg, type }); setTimeout(() => setFlash({ msg: "" }), 3000); };
  const load = useCallback(() => { setLoading(true); api.getCustomers().then(r => setCustomers(r.data)).catch(()=>{}).finally(()=>setLoading(false)); }, []);
  useEffect(() => { load(); }, [load]);

  const handleDelete = (c) => setConfirm({
    message: `Delete customer "${c.full_name}"?`,
    onConfirm: async () => {
      try { await api.deleteCustomer(c.id); showFlash("Customer deleted."); load(); }
      catch(e) { showFlash(errMsg(e), "err"); }
      setConfirm(null);
    }
  });

  return (
    <div>
      <div className="ph">
        <div>
          <div className="ph-title">Customers</div>
          <div className="ph-sub">{customers.length} registered customer{customers.length !== 1 ? "s" : ""}</div>
        </div>
        <button className="btn btn-primary" onClick={() => setShowModal(true)}>+ Add Customer</button>
      </div>
      <Alert msg={flash.msg} type={flash.type} onClose={() => setFlash({ msg: "" })} />
      <div className="card">
        <div className="card-body">
          {loading ? <div className="loading">Loading…</div> : customers.length === 0 ? (
            <div className="empty"><div className="empty-icon">👤</div><p>No customers yet.</p></div>
          ) : (
            <table>
              <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
              <tbody>
                {customers.map(c => (
                  <tr key={c.id}>
                    <td className="mono" style={{ color: "var(--dim)" }}>{c.id}</td>
                    <td style={{ fontWeight: 500 }}>{c.full_name}</td>
                    <td style={{ color: "var(--blue)" }}>{c.email}</td>
                    <td className="mono">{c.phone}</td>
                    <td><button className="btn btn-danger btn-sm" onClick={() => handleDelete(c)}>Delete</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
      {showModal && <CustomerModal onClose={() => setShowModal(false)} onSaved={() => { setShowModal(false); showFlash("Customer added."); load(); }} />}
      {confirm && <ConfirmModal {...confirm} onCancel={() => setConfirm(null)} />}
    </div>
  );
}

// ── ORDERS ───────────────────────────────────────────────────────────────────
function OrderModal({ customers, products, onClose, onSaved }) {
  const [customerId, setCustomerId] = useState("");
  const [items, setItems] = useState([{ product_id: "", quantity: "1" }]);
  const [err, setErr] = useState(""); const [loading, setLoading] = useState(false);

  const addItem = () => setItems(i => [...i, { product_id: "", quantity: "1" }]);
  const removeItem = (idx) => setItems(i => i.filter((_, j) => j !== idx));
  const setItem = (idx, k, v) => setItems(i => i.map((item, j) => j === idx ? { ...item, [k]: v } : item));

  const calcTotal = () => {
    return items.reduce((sum, it) => {
      const p = products.find(x => String(x.id) === String(it.product_id));
      const qty = parseInt(it.quantity) || 0;
      return sum + (p ? p.price * qty : 0);
    }, 0);
  };

  const submit = async () => {
    if (!customerId) return setErr("Please select a customer.");
    if (items.some(i => !i.product_id || !i.quantity || parseInt(i.quantity) <= 0))
      return setErr("All order items need a product and valid quantity.");
    setLoading(true); setErr("");
    try {
      await api.createOrder({
        customer_id: parseInt(customerId),
        items: items.map(i => ({ product_id: parseInt(i.product_id), quantity: parseInt(i.quantity) }))
      });
      onSaved();
    } catch(e) { setErr(errMsg(e)); }
    finally { setLoading(false); }
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 500 }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">Create New Order</div>
        <Alert msg={err} type="err" onClose={() => setErr("")} />
        <div className="fg">
          <label className="fl">Customer</label>
          <select className="fs" value={customerId} onChange={e => setCustomerId(e.target.value)}>
            <option value="">— Select a customer —</option>
            {customers.map(c => <option key={c.id} value={c.id}>{c.full_name} ({c.email})</option>)}
          </select>
        </div>
        <div className="fl" style={{ marginBottom: 8 }}>Order Items</div>
        <div style={{ border: "1px solid var(--border)", borderRadius: "var(--radius-sm)", padding: "12px" }}>
          {items.map((item, idx) => (
            <div key={idx} className="item-row">
              <select className="fs" value={item.product_id} onChange={e => setItem(idx, "product_id", e.target.value)}>
                <option value="">— Select product —</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name} (stock: {p.quantity})</option>)}
              </select>
              <input className="fi" type="number" min="1" value={item.quantity} onChange={e => setItem(idx, "quantity", e.target.value)} placeholder="Qty" />
              {items.length > 1 && <button className="rm-btn" onClick={() => removeItem(idx)}>✕</button>}
            </div>
          ))}
          <button className="add-row-btn" onClick={addItem}>+ Add another item</button>
        </div>
        {calcTotal() > 0 && (
          <div style={{ marginTop: 12, padding: "10px 14px", background: "var(--blue-bg)", borderRadius: "var(--radius-sm)", display: "flex", justifyContent: "space-between", fontSize: 13 }}>
            <span style={{ color: "var(--muted)" }}>Estimated Total</span>
            <span className="mono" style={{ color: "var(--blue)", fontWeight: 600 }}>{fmt(calcTotal())}</span>
          </div>
        )}
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={loading}>{loading ? "Placing…" : "Place Order"}</button>
        </div>
      </div>
    </div>
  );
}

function OrderDetail({ orderId, onClose }) {
  const [order, setOrder] = useState(null); const [err, setErr] = useState("");
  useEffect(() => {
    api.getOrder(orderId).then(r => setOrder(r.data)).catch(e => setErr(errMsg(e)));
  }, [orderId]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 500 }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">Order #{orderId} — Details</div>
        {err && <div className="alert alert-err">{err}</div>}
        {!order ? <div className="loading">Loading…</div> : (
          <>
            <div className="order-detail">
              <div className="detail-row"><span className="detail-label">Customer</span><span style={{ fontWeight: 500 }}>{order.customer?.full_name}</span></div>
              <div className="detail-row"><span className="detail-label">Email</span><span style={{ color: "var(--blue)" }}>{order.customer?.email}</span></div>
              <div className="detail-row"><span className="detail-label">Status</span><span className="badge badge-green">{order.status}</span></div>
              <div className="detail-row"><span className="detail-label">Date</span><span className="mono" style={{ fontSize: 12 }}>{new Date(order.created_at).toLocaleString()}</span></div>
            </div>
            <div style={{ margin: "0 20px 0", borderTop: "1px solid var(--border2)", paddingTop: 12 }}>
              <div className="fl" style={{ marginBottom: 8 }}>Items</div>
              <table>
                <thead><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead>
                <tbody>
                  {order.items.map(it => (
                    <tr key={it.id}>
                      <td>{it.product?.name || `#${it.product_id}`}</td>
                      <td>{it.quantity}</td>
                      <td className="mono">{fmt(it.unit_price)}</td>
                      <td className="mono">{fmt(it.unit_price * it.quantity)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{ display: "flex", justifyContent: "flex-end", padding: "12px 16px 0", borderTop: "1px solid var(--border2)", marginTop: 8 }}>
                <span style={{ color: "var(--muted)", fontSize: 13, marginRight: 16 }}>Total</span>
                <span className="mono" style={{ color: "var(--blue)", fontWeight: 600, fontSize: 15 }}>{fmt(order.total_amount)}</span>
              </div>
            </div>
          </>
        )}
        <div className="modal-footer"><button className="btn btn-ghost" onClick={onClose}>Close</button></div>
      </div>
    </div>
  );
}

function Orders() {
  const [orders, setOrders] = useState([]); const [customers, setCustomers] = useState([]); const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true); const [showModal, setShowModal] = useState(false);
  const [detailId, setDetailId] = useState(null); const [confirm, setConfirm] = useState(null);
  const [flash, setFlash] = useState({ msg: "", type: "ok" });
  const showFlash = (msg, type="ok") => { setFlash({ msg, type }); setTimeout(() => setFlash({ msg: "" }), 3000); };

  const load = useCallback(() => {
    setLoading(true);
    Promise.all([api.getOrders(), api.getCustomers(), api.getProducts()])
      .then(([o, c, p]) => { setOrders(o.data); setCustomers(c.data); setProducts(p.data); })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, []);

  useEffect(() => { load(); }, [load]);

  const handleDelete = (o) => setConfirm({
    message: `Cancel order #${o.id}? Stock will be restored.`,
    onConfirm: async () => {
      try { await api.deleteOrder(o.id); showFlash("Order cancelled and stock restored."); load(); }
      catch(e) { showFlash(errMsg(e), "err"); }
      setConfirm(null);
    }
  });

  return (
    <div>
      <div className="ph">
        <div>
          <div className="ph-title">Orders</div>
          <div className="ph-sub">{orders.length} total order{orders.length !== 1 ? "s" : ""}</div>
        </div>
        <button className="btn btn-primary" onClick={() => setShowModal(true)}>+ New Order</button>
      </div>
      <Alert msg={flash.msg} type={flash.type} onClose={() => setFlash({ msg: "" })} />
      <div className="card">
        <div className="card-body">
          {loading ? <div className="loading">Loading…</div> : orders.length === 0 ? (
            <div className="empty"><div className="empty-icon">🛒</div><p>No orders yet.</p></div>
          ) : (
            <table>
              <thead><tr><th>Order #</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
              <tbody>
                {orders.map(o => (
                  <tr key={o.id}>
                    <td className="mono" style={{ color: "var(--blue)" }}>#{o.id}</td>
                    <td style={{ fontWeight: 500 }}>{o.customer?.full_name || `Customer #${o.customer_id}`}</td>
                    <td><span className="badge badge-blue">{o.items.length} item{o.items.length !== 1 ? "s" : ""}</span></td>
                    <td className="mono">{fmt(o.total_amount)}</td>
                    <td><span className="badge badge-green">{o.status}</span></td>
                    <td className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{new Date(o.created_at).toLocaleDateString()}</td>
                    <td>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button className="btn btn-ghost btn-sm" onClick={() => setDetailId(o.id)}>View</button>
                        <button className="btn btn-danger btn-sm" onClick={() => handleDelete(o)}>Cancel</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
      {showModal && <OrderModal customers={customers} products={products} onClose={() => setShowModal(false)} onSaved={() => { setShowModal(false); showFlash("Order placed successfully."); load(); }} />}
      {detailId && <OrderDetail orderId={detailId} onClose={() => setDetailId(null)} />}
      {confirm && <ConfirmModal {...confirm} onCancel={() => setConfirm(null)} />}
    </div>
  );
}

// ── APP SHELL ────────────────────────────────────────────────────────────────
const PAGES = [
  { id: "dashboard", label: "Dashboard", icon: "⊞" },
  { id: "products",  label: "Products",  icon: "⬡" },
  { id: "customers", label: "Customers", icon: "◎" },
  { id: "orders",    label: "Orders",    icon: "◈" },
];

function App() {
  const [page, setPage] = useState("dashboard");

  const renderPage = () => {
    switch(page) {
      case "dashboard": return <Dashboard />;
      case "products":  return <Products />;
      case "customers": return <Customers />;
      case "orders":    return <Orders />;
      default:          return <Dashboard />;
    }
  };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="logo">
          <div className="logo-tag">INVTRACK</div>
          <div className="logo-name">Inventory System</div>
        </div>
        <nav className="nav">
          {PAGES.map(p => (
            <button key={p.id} className={`nav-btn ${page === p.id ? "active" : ""}`} onClick={() => setPage(p.id)}>
              <span className="nav-icon">{p.icon}</span>
              {p.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-footer">v1.0.0 · Production</div>
      </aside>
      <main className="content">{renderPage()}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
